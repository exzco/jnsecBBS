# 唯一应用配置；镜像内路径为 /app/config.yaml。
# JNSEC_* 环境变量优先于本文件，真实凭据由生产环境注入。
listen: "0.0.0.0:8080"
site_name: "JNSEC BBS"
timezone: "Asia/Shanghai"
data_dir: "/app/data"
assets_dir: "/flarum/public/assets"
base_url: "https://bbs.jnsec.org"
log_level: "info"

read_only: false
registration: "invite"
cookie_secure: true
trust_proxy: true
trusted_origins:
  - "bbs.jnsec.org"
  - "new.bbs.jnsec.org"
  - "new.jnsec.org"

# 由 JNSEC_SESSION_SECRET 注入，保留线上现有值以维持登录会话。
session_secret: ""

database:
  driver: "mysql"
  # 由 JNSEC_DB_DSN 注入，线上使用 bbs_go_shared 连接 mysql:3306/flarum。
  dsn: ""

smtp:
  host: "smtp.exmail.qq.com"
  port: 465
  username: "noreply@jnsec.org"
  # 由 JNSEC_SMTP_PASSWORD 注入。
  password: ""
  from: "noreply@jnsec.org"
