version: '2.4'

services:
  mysql:
    image: mysql:5.7
    container_name: bbs-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ}
    volumes:
      - bbsmysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # php:
  #   image: jnsecbbs:php8.3.36
  #   container_name: bbs-php
  #   restart: unless-stopped
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   ports:
  #     - "8081:80"
  #   volumes:
  #     - wwwdata:/var/www/bbs
  #     - bbslog:/var/log/apache2
  #   environment:
  #     TZ: ${TZ}
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

  app:
    image: bbs:latest
    build:
      context: .
    container_name: bbs-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT}:8080"
    environment:
      JNSEC_LISTEN: 0.0.0.0:8080
      JNSEC_SITE_NAME: ${SITE_NAME}
      JNSEC_DB_DRIVER: mysql
      JNSEC_DB_DSN: ${APP_DB_DSN:?Set APP_DB_DSN to the application database DSN}
      JNSEC_SESSION_SECRET: ${SESSION_SECRET}
      JNSEC_COOKIE_SECURE: ${COOKIE_SECURE}
      JNSEC_TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}
      JNSEC_TRUST_PROXY: "true"
      JNSEC_DATA_DIR: /app/data
      # 历史头像和附件目录，由 wwwdata 只读挂载提供，PHP 停用后仍需保留。
      JNSEC_ASSETS_DIR: ${ASSETS_DIR:-/flarum/public/assets}
      JNSEC_REGISTRATION: ${REGISTRATION}
      JNSEC_READ_ONLY: ${READ_ONLY:-false}
      # 邮件通知（SMTP）：值由服务器 .env 提供，全空 = 功能关闭
      JNSEC_SITE_URL: ${SITE_URL:-}
      JNSEC_SMTP_HOST: ${SMTP_HOST:-}
      JNSEC_SMTP_PORT: ${SMTP_PORT:-587}
      JNSEC_SMTP_USERNAME: ${SMTP_USERNAME:-}
      JNSEC_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      JNSEC_SMTP_FROM: ${SMTP_FROM:-}
      TZ: ${TZ}
    volumes:
      - appdata:/app/data     # Go 新上传的头像和附件
      - wwwdata:/flarum:ro    # 历史头像和附件
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/me >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # 现有 MySQL 数据，继续复用原外部卷。
  bbsmysql:
    external: true
  # Go 仍读取其中的 public/assets，不依赖 PHP 服务运行。
  wwwdata:
    external: true
  # Go 应用持久化数据，实际卷名带 Compose 项目前缀。
  appdata: {}
