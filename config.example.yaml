# JNSEC BBS 生产配置（bbs.jnsec.org）
listen: "0.0.0.0:8080"
site_name: "JNSEC BBS"
timezone: "Asia/Shanghai"
data_dir: "./data"
session_secret: "CHANGE-ME-to-a-random-64-char-string"
cookie_secure: true
trust_proxy: true
trusted_origins:
  - "https://bbs.jnsec.org"
  - "https://new.bbs.jnsec.org"

database:
  driver: "mysql"
  dsn: "bbs_go_ro:CHANGE-ME@tcp(127.0.0.1:3306)/bbs?charset=utf8mb4&parseTime=true&loc=Local"

registration: "invite"
assets_dir: "/flarum/public/assets"
log_level: "info"

# Enable during one-way old-to-new data synchronization.
read_only: true

# 站点对外访问地址：邮件通知里的链接前缀，留空则邮件不含链接。
# base_url: "https://bbs.jnsec.org"

# 邮件通知（SMTP）。host 与 from 任一留空 = 关闭邮件通知。
# 465 端口走隐式 TLS，其余端口协商 STARTTLS；username 留空 = 匿名发送。
# smtp:
#   host: ""
#   port: 587
#   username: ""
#   password: ""
#   from: "no-reply@jnsec.org"
