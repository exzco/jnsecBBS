name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  go:
    name: Gofmt / vet / race / test
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go 格式检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: Go 静态检查
        run: go vet ./...

      - name: Go 竞态测试
        run: go test -race -count=1 ./...

  frontend:
    name: npm 构建校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 前端静态检查
        working-directory: frontend
        run: npm run lint

      - name: 前端构建
        working-directory: frontend
        run: npm run build

  deploy:
    name: vps deploy
    needs:
      - go
      - frontend
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (
        startsWith(github.event.head_commit.message, 'Merge pull request') ||
        startsWith(github.event.head_commit.message, 'Merge branch') ||
        contains(github.event.head_commit.message, 'pull request #') ||
        contains(github.event.head_commit.message, '(#') ||
        startsWith(github.event.head_commit.message, 'cicd') ||
        startsWith(github.event.head_commit.message, 'CICD')
      )
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: 检查部署凭据
        id: creds
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USER }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 VPS_HOST / VPS_USER / VPS_SSH_KEY Secrets，本次跳过部署"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH 部署
        if: steps.creds.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          command_timeout: 30m
          script: |
            cd /opt/backup/refactorBBS/jnsecBBS && chmod +x run.sh && ./run.sh
